<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Все задачи — Deadline Boss</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="section-page section-all" data-page="all">
    <header class="section-header">
        <a class="section-brand" href="index.html">Deadline Boss</a>
        <div class="section-header-actions">
            <span id="date"></span>
            <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" aria-label="Переключить тему">☼</button>
            <button class="header-btn" onclick="showProfile()">👤 Профиль</button>
        </div>
    </header>

    <div class="section-shell">
        <aside class="section-sidebar">
            <a href="index.html">Главная</a>
            <a class="active" href="tasks.html">Все задачи</a>
            <a href="overdue.html">Просроченные</a>
            <a href="completed.html">Выполненные</a>
            <a href="support.html">Поддержка сайта</a>
        </aside>

        <main class="section-content">
            <div class="section-hero">
                <div>
                    <span class="section-kicker">Полный список</span>
                    <h1>Все задачи</h1>
                    <p>Просматривайте, редактируйте и управляйте всеми вашими задачами.</p>
                </div>
                <a class="section-action" href="index.html#add-task">+ Добавить задачу</a>
            </div>

            <section class="section-stat-row">
                <div class="section-stat"><span>Всего</span><strong id="total">0</strong></div>
                <div class="section-stat"><span>Активные</span><strong id="activeStat">0</strong></div>
                <div class="section-stat"><span>Выполнено</span><strong id="doneStat">0%</strong></div>
            </section>

            <section class="section-list-panel">
                <div class="section-list-heading">
                    <h2>Твои задачи</h2>
                    <span>Сохраняются автоматически</span>
                </div>
                <div id="taskList"></div>
            </section>
        </main>
    </div>

    <div class="modal hidden" id="profileModal">
        <div class="modal-box profile-box">
            <button class="close" onclick="closeProfileModal()">×</button>
            <h2>Профиль</h2>
            <label>Имя</label><input id="profileName" placeholder="Введите имя">
            <label>Email</label><input id="profileEmail" type="email" placeholder="name@example.com">
            <label>Школа / класс</label><input id="profileSchool" placeholder="Например: 10А">
            <div class="modal-buttons">
                <button class="cancel" onclick="closeProfileModal()">Отмена</button>
                <button class="save" onclick="saveProfile()">Сохранить</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
